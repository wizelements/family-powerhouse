name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10'

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Generate Prisma Client
        run: pnpm prisma generate
      
      - name: Lint
        run: pnpm lint
      
      - name: Typecheck
        run: pnpm typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Generate Prisma Client
        run: pnpm prisma generate
      
      - name: Run unit tests
        run: pnpm test:unit

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Start MongoDB Replica Set
        uses: supercharge/mongodb-github-action@1.11.0
        with:
          mongodb-version: '7.0'
          mongodb-replica-set: rs0
      
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Generate Prisma Client
        run: pnpm prisma generate
      
      - name: Push schema to test database
        run: pnpm prisma db push --skip-generate
        env:
          DATABASE_URL: "mongodb://127.0.0.1:27017/family_powerhouse_test?replicaSet=rs0&directConnection=true"
      
      - name: Run integration tests
        run: pnpm test:integration
        env:
          DATABASE_URL: "mongodb://127.0.0.1:27017/family_powerhouse_test?replicaSet=rs0&directConnection=true"
          NEXTAUTH_SECRET: "test-secret-key-for-ci"
          NEXTAUTH_URL: "http://localhost:3000"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run npm audit (high/critical vulnerabilities fail the build)
        run: pnpm audit --audit-level=high
      
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck, unit-tests, security-scan]
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Generate Prisma Client
        run: pnpm prisma generate
      
      - name: Build
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: true
          DATABASE_URL: "mongodb+srv://dummy:dummy@cluster.mongodb.net/dummy?retryWrites=true&w=majority"
          NEXTAUTH_SECRET: "ci-build-secret-key-change-in-production"
          NEXTAUTH_URL: "http://localhost:3000"

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint-typecheck, unit-tests, security-scan]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Start MongoDB Replica Set
        uses: supercharge/mongodb-github-action@1.11.0
        with:
          mongodb-version: '7.0'
          mongodb-replica-set: rs0
      
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Generate Prisma Client
        run: pnpm prisma generate
      
      - name: Build application
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: true
          DATABASE_URL: "mongodb://127.0.0.1:27017/family_powerhouse_e2e?replicaSet=rs0&directConnection=true"
          NEXTAUTH_SECRET: "e2e-test-secret-key"
          NEXTAUTH_URL: "http://localhost:3000"
      
      - name: Push schema to test database
        run: pnpm prisma db push --skip-generate
        env:
          DATABASE_URL: "mongodb://127.0.0.1:27017/family_powerhouse_e2e?replicaSet=rs0&directConnection=true"
      
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      
      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          DATABASE_URL: "mongodb://127.0.0.1:27017/family_powerhouse_e2e?replicaSet=rs0&directConnection=true"
          NEXTAUTH_SECRET: "e2e-test-secret-key"
          NEXTAUTH_URL: "http://localhost:3000"
      
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  truth-drift-check:
    name: Truth File Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check TRUTH.md exists
        run: test -f docs/TRUTH.md
      
      - name: Validate required sections
        run: |
          grep -q "## Technology Decisions" docs/TRUTH.md
          grep -q "## Route Map" docs/TRUTH.md
          grep -q "## Security Requirements" docs/TRUTH.md
