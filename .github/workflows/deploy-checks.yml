name: Deploy Checks

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

concurrency:
  group: deploy-checks-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

jobs:
  check-ci-status:
    name: Check CI Pipeline Status
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      ci-passed: ${{ steps.check.outputs.ci-passed }}
    steps:
      - name: Verify CI passed
        id: check
        run: |
          echo "ci-passed=true" >> $GITHUB_OUTPUT
          echo "✅ CI workflow completed successfully"
          echo "Head SHA: ${{ github.event.workflow_run.head_sha }}"
          echo "Branch: ${{ github.event.workflow_run.head_branch }}"

  deploy-readiness:
    name: Deploy Readiness Check
    runs-on: ubuntu-latest
    needs: check-ci-status
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma
        run: pnpm prisma generate

      - name: Check environment variables
        run: |
          echo "Checking required environment variables..."
          if [ -n "$NEXTAUTH_SECRET_EXISTS" ]; then
            echo "✅ NEXTAUTH_SECRET is configured"
          else
            echo "⚠️ NEXTAUTH_SECRET not set - will use Vercel environment"
          fi
          echo "✅ Environment check passed"
        env:
          NEXTAUTH_SECRET_EXISTS: ${{ secrets.NEXTAUTH_SECRET }}

      - name: Verify Prisma schema
        run: |
          echo "Verifying Prisma schema..."
          pnpm prisma validate
          echo "✅ Schema is valid"

      - name: Verify build
        run: |
          pnpm build
          echo "✅ Build successful"
        env:
          SKIP_ENV_VALIDATION: true
          DATABASE_URL: "mongodb+srv://dummy:dummy@cluster.mongodb.net/dummy?retryWrites=true&w=majority"
          NEXTAUTH_SECRET: "ci-build-secret-key-change-in-production"
          NEXTAUTH_URL: "http://localhost:3000"

      - name: Report deployment readiness
        run: |
          echo "📦 Deployment Readiness: PASSED"
          echo "✅ All checks passed - ready for deployment"
          echo "🚀 Vercel deployment will proceed automatically"

  notify-deployment:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [check-ci-status, deploy-readiness]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Create deployment summary
        run: |
          cat > deployment-summary.md << 'EOF'
          # Deployment Summary
          
          **Commit**: ${{ github.event.workflow_run.head_sha }}
          **Branch**: ${{ github.event.workflow_run.head_branch }}
          **CI Workflow**: ${{ github.event.workflow_run.html_url }}
          **Timestamp**: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          
          ## Status
          - CI Status: ${{ github.event.workflow_run.conclusion }}
          - Deploy Readiness: ${{ needs.deploy-readiness.result }}
          - Overall Status: ${{ job.status }}
          
          ## Next Steps
          If all checks passed:
          - ✅ Vercel will automatically deploy from main
          - 📊 Monitor deployment at: https://vercel.com/wizelements/family-powerhouse
          EOF
          cat deployment-summary.md

      - name: Comment on commit
        if: needs.deploy-readiness.result == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('deployment-summary.md', 'utf8');
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: '${{ github.event.workflow_run.head_sha }}',
              body: summary
            }).catch(err => console.log('Could not post comment:', err));

      - name: Upload deployment summary
        uses: actions/upload-artifact@v4
        with:
          name: deployment-summary
          path: deployment-summary.md
          retention-days: 30

  ci-failed:
    name: CI Failed - No Deployment
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion != 'success'
    steps:
      - name: Report CI failure
        run: |
          echo "❌ CI workflow failed - deployment blocked"
          echo "CI conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Review the CI workflow: ${{ github.event.workflow_run.html_url }}"
          exit 1
